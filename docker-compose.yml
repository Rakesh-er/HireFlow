version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hireflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow_admin} -d ${POSTGRES_DB:-hireflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hireflow_admin}:${POSTGRES_PASSWORD:-hireflow_secret}@postgres:5432/${POSTGRES_DB:-hireflow_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-access_secret_for_docker_dev_only}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-refresh_secret_for_docker_dev_only}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie_secret_for_docker_dev_only}
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireflow_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

